# Teste puis déploie main sur Cloudflare (battue.org).
# Secrets du dépôt : CLOUDFLARE_API_TOKEN (modèle « Edit Cloudflare Workers ») et CLOUDFLARE_ACCOUNT_ID.
# Les secrets du Worker (ADMIN_TOKEN, NTFY_TOPIC…) restent chez Cloudflare : un déploiement ne les touche pas.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de bout en bout
        run: |
          printf 'JURISDICTION=""\nADMIN_TOKEN="test-admin"\n' > .dev.vars
          npx -y wrangler@4 dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 2; done
          node tests/e2e.mjs || { cat wrangler.log; exit 1; }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
