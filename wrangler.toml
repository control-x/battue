name = "battue"
main = "src/worker.js"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "www.battue.org", custom_domain = true },  # en premier : wrangler dev sert sous ce nom
  { pattern = "battue.org", custom_domain = true },
  { pattern = "app.battue.org", custom_domain = true },
]

# Le worker passe en premier : il route /api et /r/<code>, et sert le reste depuis public/
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
JURISDICTION = "eu"

[[durable_objects.bindings]]
name = "SEARCH"
class_name = "Search"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Search"]

[[durable_objects.bindings]]
name = "SHEET"
class_name = "Sheet"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Sheet"]

# Limites de débit, approximatives et par emplacement Cloudflare
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# Compteurs admin (aucun contenu de recherche)
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "battue"

# Test complet toutes les heures ; alerte ntfy si échec (secret NTFY_TOPIC)
[triggers]
crons = ["0 * * * *"]
