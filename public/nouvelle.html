<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lancer une battue – Battue</title>
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>Battue</a>
</header>
<main class="form-page">
<h1>Lancer une battue</h1>
<p class="urgence">Appelez d'abord le <a href="tel:17" aria-label="Appeler le 17">17</a> ou le <a href="tel:112" aria-label="Appeler le 112">112</a></p>
<p class="msg" style="margin-top:-.5rem">Battue complète les secours, jamais à leur place.</p>
<form id="f">
  <fieldset>
    <legend>Où et quand</legend>
    <label>Dernier lieu où la personne a été vue<input name="address" list="addrs" required autocomplete="off" placeholder="Adresse, ville"></label>
    <datalist id="addrs"></datalist>
    <p class="or">ou, si vous y êtes&nbsp;:</p>
    <button id="here" class="btn btn-block" type="button"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-locate"/></svg>Utiliser ma position</button>
    <label style="margin-top:1.1rem">Vue pour la dernière fois le<input name="since" type="datetime-local"></label>
  </fieldset>
  <fieldset>
    <legend>La personne</legend>
    <label>Prénom<input name="name" autocomplete="off"></label>
    <label>Photo récente<span class="hint">Elle sera jointe au message et à l'affiche.</span><input name="photo" type="file" accept="image/*"></label>
    <label>Description et tenue<textarea name="description" rows="4" placeholder="Âge, taille, cheveux, vêtements, habitudes…"></textarea></label>
  </fieldset>
  <fieldset>
    <legend>Contacts</legend>
    <label>Numéro à appeler si quelqu'un la voit<span class="hint">Un seul numéro, toujours joignable.</span><input name="phone" type="tel" autocomplete="tel" placeholder="06 12 34 56 78"></label>
    <label>Lien du groupe WhatsApp des bénévoles<span class="hint">Facultatif. Dans WhatsApp&nbsp;: infos du groupe, puis « Inviter via un lien ».</span><input name="whatsapp" type="url" placeholder="https://chat.whatsapp.com/…"></label>
  </fieldset>
  <label class="check"><input name="police" type="checkbox" required> J'ai signalé la disparition à la police ou à la gendarmerie.</label>
  <button class="btn btn-primary btn-block btn-big submit" type="submit">Créer la battue</button>
  <p id="msg" class="msg" role="status"></p>
</form>
</main>
<script>
var form=document.getElementById("f"), msg=document.getElementById("msg"), found={};
function say(t,isErr){msg.textContent=t;msg.className=isErr?"msg err":"msg";}
// Adresse déjà saisie sur la page d'accueil
form.address.value=new URLSearchParams(location.search).get("adresse")||"";
// Suggestions d'adresses (Base Adresse Nationale), appelées depuis le navigateur
var timer;
form.address.oninput=function(){
  clearTimeout(timer); var q=this.value.trim(); if(q.length<4||found[q])return;
  timer=setTimeout(function(){geocode(q,5).then(function(fs){
    document.getElementById("addrs").innerHTML=fs.map(function(f){found[f.properties.label]=f;return '<option value="'+f.properties.label.replace(/"/g,"&quot;")+'">';}).join("");
  });},300);
};
function geocode(q,limit){
  return fetch("https://api-adresse.data.gouv.fr/search/?limit="+limit+"&q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(j){return j.features||[];});
}
// Photo réduite dans le navigateur : 800 px, JPEG
function shrink(file){
  if(!file)return Promise.resolve("");
  return createImageBitmap(file).then(function(img){
    var k=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.75);
  });
}
// Sur place : la position exacte du téléphone, avec l'adresse la plus proche pour l'affichage
document.getElementById("here").onclick=function(){
  if(!navigator.geolocation)return say("Position indisponible sur cet appareil.",true);
  say("Recherche de votre position…");
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude, lng=pos.coords.longitude;
    fetch("https://api-adresse.data.gouv.fr/reverse/?lat="+lat+"&lon="+lng).then(function(r){return r.json();}).then(function(j){
      var f=j.features&&j.features[0]; return f&&"Près de "+f.properties.label;
    }).catch(function(){}).then(function(label){
      label=label||"Position "+lat.toFixed(5)+", "+lng.toFixed(5);
      found[label]={properties:{label:label},geometry:{coordinates:[lng,lat]}};
      form.address.value=label; say("");
    });
  },function(){say("Position refusée : autorisez la localisation, ou saisissez l'adresse.",true);},{enableHighAccuracy:true,timeout:15000});
};
form.onsubmit=function(e){
  e.preventDefault();
  var q=form.address.value.trim(), btn=form.querySelector("button[type=submit]");
  btn.disabled=true; say("Création…");
  Promise.all([found[q]?[found[q]]:geocode(q,1),shrink(form.photo.files[0])]).then(function(r){
    var f=r[0][0]; if(!f)throw new Error("Adresse introuvable, précisez la ville.");
    return fetch("/api/new",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      name:form.name.value.trim(), address:f.properties.label, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0],
      since:form.since.value, sinceTs:form.since.value?new Date(form.since.value).getTime():null, description:form.description.value.trim(), phone:form.phone.value.trim(),
      whatsapp:form.whatsapp.value.trim(), photo:r[1], police:form.police.checked})});
  }).then(function(res){return res.json().then(function(j){if(!res.ok)throw new Error(j.error||"Erreur "+res.status);return j;});})
    .then(function(j){location.href="/r/"+j.id+"#c="+j.coord+"&new";})
    .catch(function(err){btn.disabled=false;say(err.message==="Failed to fetch"?"Pas de connexion internet, réessayez.":err.message,true);});
};
</script>
</body>
</html>
